<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator №1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>




<div class="calck_wrapp">
<span class="bcgr"></span>
<div class="plato">

    <div class="wrapp_content">
        <input class="inpt" type="text">
        <div class="inpt_result"></div>
    </div>

    <div class="group_btns">

        <div class="grp group_btns_opert">
            <div class="btnProp btn plus btn_squed"><span>+</span></div>
            <div class="btnProp btn minus btn_squed"><span>-</span></div>
            <div class="btnProp btn mult btn_squed"><span>*</span></div>
            <div class="btnProp btn delt btn_squed"><span>/</span></div>
            <div class="btnProp btn remove btn_squed"><span>del</span></div>
        </div>

        <div class="grp group_btns_numbrs">
            <div class="btnProp btn btn_circl"><span>1</span></div>
            <div class="btnProp btn btn_circl"><span>2</span></div>
            <div class="btnProp btn btn_circl"><span>3</span></div>
            <div class="btnProp btn btn_circl"><span>4</span></div>
            <div class="btnProp btn btn_circl"><span>5</span></div>
            <div class="btnProp btn btn_circl"><span>6</span></div>
            <div class="btnProp btn btn_circl"><span>7</span></div>
            <div class="btnProp btn btn_circl"><span>8</span></div>
        </div>

        <div class="grp group_btns_others">
            <div class="btnProp btn btn_4 btn_circl"><span>9</span></div>
            <div class="btnProp btn btn_5 btn_circl"><span>0</span></div>
            <div class="btnProp btn_clear btn_squed btn_spec1"><span>C</span></div>
            <div class="btnProp result btn_squed btn_spec2"><span>=</span></div>
        </div>

    </div>

</div>

</div>







<script src="script.js"></script>


</body>
</html>
